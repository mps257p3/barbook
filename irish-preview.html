<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<title>Irish Mug Preview</title>
<style>
  body { background:#fff; display:flex; gap:40px; padding:60px; justify-content:center; align-items:center; }
  .glass { display:flex; flex-direction:column; align-items:center; gap:14px; }
  .label { font-family:sans-serif; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#555; }
</style>
</head>
<body>

<!-- IRISH MUG v1 -->
<div class="glass">
  <svg width="120" height="168" viewBox="0 0 50 70" fill="none">
    <!-- corpo levemente afunilado no topo -->
    <path d="M 9 12 C 9 12 8 58 8 60 C 8 61 32 61 32 60 C 32 58 31 12 31 12 Z"
          stroke="#222" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- rim elíptico -->
    <path d="M 9 12 C 9 9 31 9 31 12"
          stroke="#222" stroke-width="1.6" stroke-linecap="round"/>
    <!-- base elíptica inferior -->
    <path d="M 8 60 C 8 63 32 63 32 60"
          stroke="#222" stroke-width="1.6" stroke-linecap="round"/>
    <!-- pedestal -->
    <path d="M 8 63 L 6 67 L 34 67 L 32 63"
          stroke="#222" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M 6 67 C 6 69 34 69 34 67"
          stroke="#222" stroke-width="1.6" stroke-linecap="round"/>
    <!-- alça -->
    <path d="M 31 22 C 44 22 44 50 31 50"
          stroke="#222" stroke-width="1.6" stroke-linecap="round"/>
    <!-- reflexo lateral esquerdo -->
    <path d="M 11 18 L 11 32" stroke="#222" stroke-width="0.9" stroke-linecap="round" opacity="0.35"/>
    <!-- vapor -->
    <path d="M 15 7 C 14 4 16 2 15 0"  stroke="#222" stroke-width="1.0" stroke-linecap="round" opacity="0.4"/>
    <path d="M 20 6 C 19 3 21 1 20 -1" stroke="#222" stroke-width="1.0" stroke-linecap="round" opacity="0.4"/>
    <path d="M 25 7 C 24 4 26 2 25 0"  stroke="#222" stroke-width="1.0" stroke-linecap="round" opacity="0.4"/>
  </svg>
  <span class="label">Caneca Irish</span>
</div>

</body>
</html>
